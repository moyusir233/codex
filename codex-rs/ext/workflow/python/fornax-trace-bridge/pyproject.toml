[project]
name = "codex-fornax-trace-bridge"
version = "0.1.0"
description = "Optional experimental Fornax trace bridge for Codex workflows"
requires-python = ">=3.10"
dependencies = [
    "bytedance.fornax==1.0.46",
    "bytedlogid==0.2.1",
]

[project.scripts]
codex-fornax-trace = "codex_fornax_trace_bridge.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[[tool.uv.index]]
name = "bytedance"
url = "https://bytedpypi.byted.org/simple/"
default = true
